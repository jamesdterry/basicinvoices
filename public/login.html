<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Basic Invoices — Sign in</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="stack">
      <h1>Basic Invoices</h1>
      <p>Sign in with a magic link.</p>
      <form id="login-form" class="stack" novalidate>
        <label class="stack">
          <span>Email</span>
          <input class="input" type="email" name="email" required autocomplete="email" />
        </label>
        <button class="btn" type="submit" disabled>Email me a link</button>
      </form>
      <p class="muted">Auth wiring lands in Stage 1. This page is a stub.</p>
    </main>
  </body>
</html>
