<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Basic Invoices — Sign in</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="stack">
      <h1>Basic Invoices</h1>
      <p id="login-status" class="muted" hidden></p>
      <form id="magic-link-form" class="stack" novalidate>
        <label class="stack">
          <span>Email</span>
          <input class="input" type="email" name="email" required autocomplete="email" />
        </label>
        <button class="btn" type="submit">Email me a link</button>
      </form>
      <details>
        <summary class="muted">Sign in with a password instead</summary>
        <form id="password-form" class="stack" novalidate>
          <label class="stack">
            <span>Email</span>
            <input class="input" type="email" name="email" required autocomplete="email" />
          </label>
          <label class="stack">
            <span>Password</span>
            <input class="input" type="password" name="password" required autocomplete="current-password" />
          </label>
          <button class="btn" type="submit">Sign in</button>
        </form>
      </details>
    </main>
    <script type="module" src="/views/login.js"></script>
  </body>
</html>
