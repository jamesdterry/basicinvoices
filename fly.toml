# fly.toml — Basic Invoices.
# Replace `app` and `primary_region` before first deploy.

app = "basicinvoices"
primary_region = "ord"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/basicinvoices.sqlite"
  NODE_ENV = "production"

[mounts]
  source = "data"
  destination = "/data"

# min_machines_running = 1 is required so the in-process recurring-billing
# timer (Stage 8) fires hourly. Deliberate departure from the playbook default
# of 0; the cost for one consultant is negligible and removes "cron didn't
# fire" failure modes.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
