# fly.toml app configuration file generated for basicinvoices on 2026-05-07T13:44:07-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'basicinvoices'
primary_region = 'ord'

[build]

[env]
  DB_PATH = '/data/basicinvoices.sqlite'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'data'
  destination = '/data'

# Stage 8.5 — the in-process recurring tick is no longer the primary trigger.
# A daily GitHub Action (.github/workflows/recurring-tick.yml) hits
# /cron/recurring-tick with a TOTP code; the inbound HTTP request wakes the
# machine via auto_start_machines. The wake-on-activity hook in routes/me.js
# fires maybeRunDue when the consultant uses the app. Both paths self-gate
# via the _recurring_meta atomic claim, so the leftover in-process timer is
# harmless redundancy when the machine happens to be up.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory_mb = 512
  cpu_kind = 'shared'
  cpus = 1
